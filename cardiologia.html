<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA | Avaliação Cardiológica</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f1f5f9;color:#17324a;margin:0}main{max-width:900px;margin:24px auto;padding:24px;background:white;border-radius:16px}label{display:block;margin:14px 0}input,textarea{display:block;width:100%;padding:12px;border:1px solid #aabac8;border-radius:8px;font:inherit}button,a.action{display:inline-block;background:#07598c;color:white;padding:12px 18px;border:0;border-radius:8px;font:inherit;cursor:pointer}article{border-bottom:1px solid #ddd;padding:16px 0;white-space:pre-wrap;overflow-wrap:anywhere}@media print{button,.controls{display:none}main{margin:0;max-width:none}article{break-inside:avoid}}</style><main><small>SIGMA • Hospital São José</small><h1>Avaliação Cardiológica</h1><section id="publico" hidden><p>Preencha os dados para solicitar uma avaliação. Não utilize este formulário para emergências.</p><form id="pedido"><label>Nome do paciente<input name="paciente" required maxlength="160"></label><label>Leito<input name="leito" required maxlength="40"></label><label>Data da solicitação<input name="data" type="date" required></label><label>Motivo da solicitação<textarea name="motivo" required maxlength="2000" rows="5"></textarea></label><label>Nome do solicitante<input name="solicitante" required maxlength="160"></label><button>Enviar solicitação</button></form></section><section id="gestao" hidden><div class="controls"><p>Histórico restrito à administração.</p><form id="login"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="senha" type="password" required></label><button>Entrar</button></form><div id="filtros" hidden><label>De<input id="de" type="date"></label><label>Até<input id="ate" type="date"></label><button id="buscar">Atualizar histórico</button> <button id="imprimir">Imprimir / salvar PDF</button> <button id="sair">Sair</button><p><a href="./cardiologia.html" target="_blank" rel="noopener">Abrir formulário externo</a></p></div></div><div id="lista"></div></section><p id="status" role="status" aria-live="polite"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {getFirestore,collection,addDoc,serverTimestamp,getDocs,query,orderBy,where,limit} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const app=initializeApp({
            apiKey: "AIzaSyDU2o6d_p_gyEhekS_tt1SJlwsKl5wTqgM",
            authDomain: "hospitalsaojose-7819b.firebaseapp.com",
            projectId: "hospitalsaojose-7819b",
            storageBucket: "hospitalsaojose-7819b.firebasestorage.app",
            messagingSenderId: "559023248256",
            appId: "1:559023248256:web:42fd92df5516c368ed2765",
            measurementId: "G-NX7M01F07D"
        }),db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id),col=collection(db,'cardiologyRequests'),status=t=>$('status').textContent=t,admin=new URLSearchParams(location.search).get('gestao')==='1';
$('publico').hidden=admin;$('gestao').hidden=!admin;
const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Maceio'}).format(new Date());$('pedido').elements.data.value=today;$('de').value=today.slice(0,8)+'01';$('ate').value=today;
$('pedido').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{const d=Object.fromEntries(new FormData(f));for(const k in d)d[k]=d[k].trim();if(Object.values(d).some(v=>!v))throw Error('Preencha todos os campos');const ref=await addDoc(col,{...d,createdAt:serverTimestamp()});f.reset();f.elements.data.value=today;status('Solicitação registrada. Protocolo: '+ref.id)}catch(e){status('Não foi possível confirmar o envio. Contate o NIR.')}finally{b.disabled=false}};
async function load(){if(!auth.currentUser)return; $('lista').replaceChildren();status('Consultando histórico...');try{const de=$('de').value,ate=$('ate').value;if(!de||!ate||de>ate)throw Error();const snap=await getDocs(query(col,where('data','>=',de),where('data','<=',ate),orderBy('data','desc'),limit(1000)));for(const doc of snap.docs){const d=doc.data(),a=document.createElement('article');a.textContent=['Protocolo: '+doc.id,'Paciente: '+d.paciente,'Leito: '+d.leito,'Data: '+d.data,'Motivo: '+d.motivo,'Solicitante: '+d.solicitante,'Registro: '+(d.createdAt?.toDate().toLocaleString('pt-BR',{timeZone:'America/Maceio'})||'Não disponível')].join('\n');$('lista').append(a)}status(snap.size+' solicitações'+(snap.size===1000?' — limite atingido, reduza o período.':''));}catch(e){status('Não foi possível consultar o histórico. Verifique as permissões e o período.')}}
if(admin){onAuthStateChanged(auth,u=>{$('login').hidden=!!u;$('filtros').hidden=!u;$('lista').replaceChildren();if(u)load();else status('');});$('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,e.target.elements.email.value,e.target.elements.senha.value);e.target.reset()}catch{status('Não foi possível autenticar.')}};$('buscar').onclick=load;$('imprimir').onclick=()=>window.print();$('sair').onclick=()=>signOut(auth);}
</script></html>
